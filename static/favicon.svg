<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
    <!-- Deliberately invisible: the tab shows nothing. The 4x4 dot is a 1:1
         transcription of transparent_avatar_800x800.png, kept only so the
         file has actual drawable content (empty SVGs risk a fallback to the
         browser's default page icon, which would be *more* visible). At
         0.5% of the canvas it lands well under a pixel at every favicon
         size, so it renders as nothing. -->
    <rect x="398" y="398" width="4" height="4" fill="#000"/>
</svg>
