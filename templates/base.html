<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>avon</title>
    {# ?v= makes every release a new URL: browsers must refetch changed
       assets, and can cache them hard in between (immutable headers on
       /static in main.rs). #}
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ version() }}">
    <script src="/static/htmx.min.js?v={{ version() }}"></script>
    <script src="/static/search.js?v={{ version() }}" defer></script>
    <link rel="stylesheet" href="/static/style.css?v={{ version() }}">
</head>
<body>
    {% block content %}{% endblock %}
    <span class="app-version">v{{ version() }}</span>
</body>
</html>
